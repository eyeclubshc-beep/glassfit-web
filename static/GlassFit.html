<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlassFit AR 피팅</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #07031a;
            color: #ece8ff;
            font-family: sans-serif;
        }
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #07031a;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: #17103b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        #main-content {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 비밀번호 인증 화면 -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h3 style="margin-bottom: 15px; color: #b44cff;">GlassFit 접근 인증</h3>
            <p style="margin-bottom: 20px; font-size: 14px; color: #aaa;">허가된 사용자만 이용할 수 있습니다.</p>
            <input type="password" id="auth-password" placeholder="비밀번호를 입력하세요" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #444; background: #07031a; color: #fff; box-sizing: border-box;">
            <button onclick="checkPassword()" style="width: 100%; padding: 10px; background: #b44cff; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">확인</button>
            <p id="auth-error" style="color: #ff4c4c; font-size: 12px; margin-top: 10px; display: none;">비밀번호가 틀렸습니다.</p>
        </div>
    </div>

    <!-- 실제 GlassFit 피팅 프로그램 영역 -->
    <div id="main-content">
        <!-- 기존에 사용하시던 GlassFit HTML / 자바스크립트 전체 코드를 여기에 넣으세요 -->
        <div style="padding: 20px; text-align: center;">
            <h2>인증 성공: GlassFit 피팅 시스템이 정상 작동합니다.</h2>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pw = document.getElementById('auth-password').value;
            if (pw === '01056315945') {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('auth-error').style.display = 'block';
            }
        }
        document.getElementById('auth-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
